name: grade_calculator_app
description: A professional Grade Calculator Desktop Application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Excel read/write
  excel: ^4.0.2
  
  # File picker (upload Excel file)
  file_picker: ^8.0.0+1
  
  # Save/download file dialog
  path_provider: ^2.1.2
  
  # Animations & UI
  flutter_animate: ^4.5.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
